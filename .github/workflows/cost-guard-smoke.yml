name: Cost guard smoke

on:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify AI rate limit
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://signaldesk-henna.vercel.app"
          PAYLOAD='{"market":{"marketId":"GXh9iztJTm5v6qDWnR4YcKHbSc3AUZ2VEMGfKEegd92V","category":"gaming","title":"Will GTA 6 release on November 19th, 2026","description":"Will GTA 6 release on November 19th, 2026","phase":"secondary","yes":0.5,"no":0.5,"volume":5,"daysToClose":56},"mode":"research"}'
          LAST=""
          for i in $(seq 1 9); do
            LAST="$(curl -sS -o /tmp/body -w '%{http_code}' -X POST "$BASE/api/analyze"               -H 'content-type: application/json'               -H 'x-signaldesk-client: cost-guard-smoke-v2'               --data "$PAYLOAD")"
            echo "attempt=$i status=$LAST"
          done
          test "$LAST" = "429"
          cat /tmp/body
