name: Production smoke test

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise SignalDesk production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://signaldesk-henna.vercel.app"
          TEST_WALLET="11111111111111111111111111111111"

          echo "1) health"
          HEALTH="$(curl --fail-with-body -sS "$BASE/api/health")"
          echo "$HEALTH" | jq -e '.pantaConfigured == true and .openaiAuthOk == true' >/dev/null

          echo "2) markets"
          MARKETS="$(curl --fail-with-body -sS "$BASE/api/markets")"
          echo "$MARKETS" | jq -e '.mode == "live" and (.markets | length) > 0' >/dev/null
          RESEARCH_MARKET="$(echo "$MARKETS" | jq -c '[.markets[] | select(.category!="politics")][0]')"
          test "$RESEARCH_MARKET" != "null"

          echo "3) market activity"
          ACTIVITY_MARKET="$(echo "$MARKETS" | jq -r '.markets[0].marketId')"
          ACTIVITY="$(curl --fail-with-body -sS "$BASE/api/market-activity?marketId=$ACTIVITY_MARKET")"
          echo "$ACTIVITY" | jq -e '.marketId != null and .tradeCount != null' >/dev/null

          echo "4) positions"
          POSITIONS="$(curl --fail-with-body -sS "$BASE/api/positions?wallet=$TEST_WALLET")"
          echo "$POSITIONS" | jq -e '.positions != null' >/dev/null

          echo "5) AI research"
          ANALYZE_PAYLOAD="$(jq -n --argjson market "$RESEARCH_MARKET" '{market:$market,mode:"research"}')"
          ANALYSIS="$(curl --fail-with-body -sS -X POST "$BASE/api/analyze" -H 'content-type: application/json' --data "$ANALYZE_PAYLOAD")"
          echo "$ANALYSIS" | jq -e '.analysis | type=="string" and length>20' >/dev/null

          echo "6) primary quote — try all visible primary markets"
          QUOTE=""
          MARKET_ID=""
          while IFS= read -r candidate; do
            test -n "$candidate" || continue
            echo "Trying $candidate"
            PAYLOAD="$(jq -n --arg wallet "$TEST_WALLET" --arg marketId "$candidate" '{wallet:$wallet,marketId:$marketId,side:"yes",amountUsdc:"20.00"}')"
            RESPONSE="$(curl -sS -X POST "$BASE/api/quote" -H 'content-type: application/json' --data "$PAYLOAD")"
            if echo "$RESPONSE" | jq -e '.quoteId != null' >/dev/null 2>&1; then
              MARKET_ID="$candidate"
              QUOTE="$RESPONSE"
              break
            fi
            echo "$RESPONSE" | jq .
          done < <(echo "$MARKETS" | jq -r '.markets[] | select(.phase=="primary") | .marketId')

          if [ -z "$QUOTE" ]; then
            echo "NO_VISIBLE_PRIMARY_MARKET_ACCEPTED_A_QUOTE"
            exit 2
          fi
          echo "$QUOTE" | jq .
          QUOTE_ID="$(echo "$QUOTE" | jq -r '.quoteId')"

          echo "7) unsigned build"
          BUILD_PAYLOAD="$(jq -n --arg wallet "$TEST_WALLET" --arg quoteId "$QUOTE_ID" '{wallet:$wallet,quoteId:$quoteId,maxSlippageBps:100}')"
          BUILD="$(curl -sS -X POST "$BASE/api/build" -H 'content-type: application/json' --data "$BUILD_PAYLOAD")"
          echo "$BUILD" | jq .
          echo "$BUILD" | jq -e '.signingRequired == true and .broadcasted == false and .instructionCount > 0' >/dev/null

          echo "ALL_PRODUCTION_SMOKE_TESTS_PASSED"
