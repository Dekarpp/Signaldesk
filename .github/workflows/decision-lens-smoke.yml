name: Decision lens smoke

on:
  push:
    branches: [main]

jobs:
  decision:
    runs-on: ubuntu-latest
    steps:
      - name: Verify non-political decision lens
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://signaldesk-henna.vercel.app"
          PAYLOAD='{"market":{"marketId":"GXh9iztJTm5v6qDWnR4YcKHbSc3AUZ2VEMGfKEegd92V","category":"gaming","title":"Will GTA 6 release on November 19th, 2026","description":"Will GTA 6 release on November 19th, 2026","phase":"secondary","yes":0.5,"no":0.5,"volume":5,"daysToClose":56},"mode":"research"}'
          RESULT="$(curl -fsS -X POST "$BASE/api/analyze"             -H 'content-type: application/json'             -H 'x-signaldesk-client: decision-smoke-gta'             --data "$PAYLOAD")"
          echo "$RESULT" | jq '{decision:.brief.decision, sourceCount:(.sources|length)}'
          echo "$RESULT" | jq -e '.brief.decision.signal | IN("leans_yes","balanced","leans_no","unclear")' >/dev/null
          echo "$RESULT" | jq -e '(.brief.decision.summary | length) > 5' >/dev/null
          echo "$RESULT" | jq -e '(.sources | length) >= 1' >/dev/null

      - name: Verify political neutrality guard
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://signaldesk-henna.vercel.app"
          PAYLOAD='{"market":{"marketId":"TestMarketPoliticalGuard","category":"politics","title":"Will Candidate A win the example election?","description":"Sandbox political neutrality test","phase":"secondary","yes":0.5,"no":0.5,"disclaimer":"sandbox"},"mode":"research"}'
          RESULT="$(curl -fsS -X POST "$BASE/api/analyze"             -H 'content-type: application/json'             -H 'x-signaldesk-client: decision-smoke-politics'             --data "$PAYLOAD")"
          echo "$RESULT" | jq '{decision:.brief.decision}'
          echo "$RESULT" | jq -e '.brief.decision.signal == "not_assessed"' >/dev/null
